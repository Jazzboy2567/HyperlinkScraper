<!DOCTYPE html>
<html>

<head>
    <title>Website Scraper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1600px;
            margin: 20px auto;
            padding: 20px;
        }

        input {
            width: 500px;
            padding: 10px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
        }

        .search-btn {
            padding: 5px 15px;
            font-size: 14px;
            margin-left: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .search-btn:hover {
            background-color: #45a049;
        }

        .link {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .link-content {
            flex: 1;
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .link-content a {
            word-break: break-all;
            display: inline-block;
            max-width: 100%;
        }

        .link-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .external-link {
            background-color: #fff4e8;
        }

        .input-container {
            margin-bottom: 20px;
        }

        .loading-preview {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 18px;
            color: #666;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            padding: 10px 20px;
            background-color: #f0f0f0;
            border: none;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            font-size: 14px;
        }

        .tab.active {
            background-color: #2196F3;
            color: white;
        }

        .tab:hover {
            background-color: #e0e0e0;
        }

        .tab.active:hover {
            background-color: #1976D2;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .category-card {
            background-color: #e3f2fd;
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .category-title {
            font-size: 18px;
            font-weight: bold;
            color: #1565C0;
        }

        .category-count {
            background-color: #2196F3;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
        }

        .category-pattern {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            font-family: monospace;
        }

        .subcategories {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .subcategory-tag {
            background-color: #90CAF9;
            color: #0D47A1;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .toggle-category {
            background-color: #1976D2;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .toggle-category:hover {
            background-color: #1565C0;
        }

        .category-links {
            margin-top: 10px;
            display: none;
        }

        .category-links.show {
            display: block;
        }

        .filter-container {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .filter-input {
            width: 300px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .filter-label {
            font-weight: bold;
            margin-right: 10px;
        }

        .clear-filter-btn {
            padding: 8px 15px;
            background-color: #757575;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        .clear-filter-btn:hover {
            background-color: #616161;
        }

        .stats-badge {
            background-color: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        .link.hidden {
            display: none;
        }

        .skills-panel {
            background-color: #e8f5e9;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .skills-input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .analyze-btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .analyze-btn:hover {
            background-color: #45a049;
        }

        .job-score {
            background-color: #4CAF50;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            margin-left: 10px;
        }

        .job-score.medium {
            background-color: #FF9800;
        }

        .job-score.low {
            background-color: #f44336;
        }

        .extracted-info {
            background-color: #f5f5f5;
            border-left: 3px solid #2196F3;
            padding: 10px;
            margin-top: 10px;
            font-size: 13px;
        }

        .skill-tag {
            display: inline-block;
            background-color: #2196F3;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            margin: 2px;
            font-size: 11px;
        }

        .skill-tag.matched {
            background-color: #4CAF50;
        }

        .requirement-item {
            margin: 5px 0;
            padding-left: 15px;
        }
    </style>
</head>

<body>
    <h1>Website Scraper</h1>
    <div class="input-container">
        <input type="text" id="urlInput" placeholder="Enter website URL" value="https://en.wikipedia.org/wiki/Cat">
        <button onclick="scrape()">Scrape</button>
    </div>

    <div class="container">
        <div id="results"></div>
    </div>

    <script>
        let currentPageUrl = '';
        let allLinksData = [];

        // Function to filter out resource files
        function isResourceFile(url) {
            const resourceExtensions = ['.css', '.js', '.ico', '.svg', '.woff', '.woff2', '.ttf', '.eot'];
            const lowerUrl = url.toLowerCase();
            return resourceExtensions.some(ext => lowerUrl.endsWith(ext));
        }

        async function scrape() {
            const url = document.getElementById('urlInput').value;

            if (!url) {
                alert('Please enter a URL');
                return;
            }

            currentPageUrl = url;
            document.getElementById('results').innerHTML = '<p>Loading...</p>';

            try {
                const response = await fetch('/api/scrape?url=' + encodeURIComponent(url));
                const data = await response.json();

                if (data.error) {
                    document.getElementById('results').innerHTML = '<p style="color: red;">Error: ' + data.error + '</p>';
                    return;
                }

                // Filter out resource files
                const originalCount = data.externalLinks.length;
                data.externalLinks = data.externalLinks.filter(link => !isResourceFile(link.url));
                const filteredCount = originalCount - data.externalLinks.length;

                // Update stats
                data.stats.external = data.externalLinks.length;
                data.stats.resourcesFiltered = filteredCount;

                // Re-index links after filtering
                data.externalLinks.forEach((link, index) => {
                    link.index = index;
                });

                // Update categories to remove resource files
                data.categories.forEach(category => {
                    category.links = category.links.filter(link => !isResourceFile(link.url));
                    category.count = category.links.length;
                });

                // Remove empty categories
                data.categories = data.categories.filter(cat => cat.count > 0);
                data.stats.categories = data.categories.length;

                allLinksData = data;
                renderResults(data);

                // Store links globally for access
                window.currentLinks = data.externalLinks;
            } catch (error) {
                document.getElementById('results').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }

        function renderResults(data, titleFilter = '') {
            let html = '<h2>Results</h2>';
            html += '<h3>Page Title: ' + data.title + '</h3>';
            html += '<p><strong>Source:</strong> <a href="' + data.sourceUrl + '" target="_blank">' + data.sourceUrl + '</a></p>';
            html += '<p><strong>External Links:</strong> ' + data.stats.external;
            if (data.stats.resourcesFiltered > 0) {
                html += ' <span class="stats-badge">Filtered ' + data.stats.resourcesFiltered + ' resource files</span>';
            }
            html += ' | <strong>Categories:</strong> ' + data.stats.categories + '</p>';

            // Skills Analysis Panel (show for job sites)
            const isJobSite = data.sourceUrl.includes('indeed.com') ||
                data.sourceUrl.includes('linkedin.com') ||
                data.sourceUrl.includes('glassdoor.com');

            if (isJobSite) {
                html += '<div class="skills-panel">';
                html += '<h3 style="margin-top: 0; color: #2E7D32;">Job Analysis & Matching</h3>';
                html += '<p style="margin-bottom: 10px;">Enter your skills (comma-separated) to analyze and score job matches:</p>';
                html += '<input type="text" class="skills-input" id="userSkills" placeholder="e.g., Python, JavaScript, React, AWS, Machine Learning, SQL">';
                html += '<button class="analyze-btn" onclick="analyzeJobs()">Analyze Jobs</button>';
                html += '</div>';
            }

            // Filter input
            html += '<div class="filter-container">';
            html += '<span class="filter-label">Filter by title:</span>';
            html += '<input type="text" class="filter-input" id="titleFilter" placeholder="Enter search term..." value="' + titleFilter + '" onkeyup="filterByTitle()">';
            html += '<button class="clear-filter-btn" onclick="clearFilter()">Clear</button>';
            html += '<span id="filterCount" style="margin-left: 15px; color: #666;"></span>';
            html += '</div>';

            // Tabs
            html += '<div class="tabs">';
            html += '<button class="tab active" onclick="switchTab(\'categories\')">Categories (' + data.stats.categories + ')</button>';
            html += '<button class="tab" onclick="switchTab(\'all\')">All Links (' + data.stats.external + ')</button>';
            html += '</div>';

            // Categories tab
            html += '<div id="categories-tab" class="tab-content active">';
            if (data.categories.length > 0) {
                data.categories.forEach((category, catIndex) => {
                    html += '<div class="category-card">';
                    html += '<div class="category-header">';
                    html += '<div class="category-title">' + category.domain + '</div>';
                    html += '<div class="category-count">' + category.count + ' links</div>';
                    html += '</div>';
                    html += '<div class="category-pattern">/' + category.pattern + '</div>';

                    if (category.subcategories.length > 0) {
                        html += '<div class="subcategories">';
                        category.subcategories.forEach(sub => {
                            html += '<span class="subcategory-tag">' + sub + '</span>';
                        });
                        html += '</div>';
                    }

                    html += '<button class="toggle-category" onclick="toggleCategory(' + catIndex + ')">Show Links</button>';
                    html += '<div id="category-' + catIndex + '" class="category-links">';

                    category.links.forEach(link => {
                        html += renderLink(link, titleFilter);
                    });

                    html += '</div>';
                    html += '</div>';
                });
            } else {
                html += '<p>No categories found (need 3+ similar links to form a category)</p>';
            }
            html += '</div>';

            // All links tab
            html += '<div id="all-tab" class="tab-content">';
            data.externalLinks.forEach((link, index) => {
                html += renderLink({ ...link, index }, titleFilter);
            });
            html += '</div>';

            document.getElementById('results').innerHTML = html;

            // Update filter count
            updateFilterCount();
        }

        function renderLink(link, titleFilter = '') {
            const escapedText = link.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const escapedUrl = link.url.replace(/"/g, '&quot;');

            // Check if link matches filter
            const matchesFilter = !titleFilter ||
                link.text.toLowerCase().includes(titleFilter.toLowerCase()) ||
                link.url.toLowerCase().includes(titleFilter.toLowerCase());

            const hiddenClass = matchesFilter ? '' : ' hidden';

            // Check if this is a redirect/tracking link
            const isRedirectLink = link.url.includes('/rc/clk') ||
                link.url.includes('/redir/') ||
                link.url.includes('/redirect') ||
                link.url.includes('/click/') ||
                link.url.includes('?redirect=');

            let html = '<div class="link external-link' + hiddenClass + '" data-link-text="' + escapedText.toLowerCase() + '" data-link-url="' + escapedUrl.toLowerCase() + '">';
            html += '<div class="link-content">';
            html += '<strong>' + escapedText + '</strong><br>';
            html += '<a href="' + escapedUrl + '" target="_blank">' + escapedUrl + '</a>';

            // Show redirect indicator
            if (isRedirectLink) {
                html += '<br><span style="color: #ff9800; font-size: 12px;">Tracking/Redirect Link</span>';
            }

            html += '</div>';
            html += '<div class="link-actions">';

            // Add "Follow" button for redirect links
            if (isRedirectLink) {
                html += '<button class="preview-btn" style="background-color: #ff9800;" onclick="followRedirect(' + link.index + ')">Follow</button>';
            }

            html += '<button class="search-btn" onclick="searchLink(' + link.index + ')">Search</button>';
            html += '</div>';
            html += '</div>';

            return html;
        }

        function filterByTitle() {
            const filterValue = document.getElementById('titleFilter').value.toLowerCase();
            const links = document.querySelectorAll('.link');

            links.forEach(link => {
                const text = link.getAttribute('data-link-text') || '';
                const url = link.getAttribute('data-link-url') || '';

                if (text.includes(filterValue) || url.includes(filterValue)) {
                    link.classList.remove('hidden');
                } else {
                    link.classList.add('hidden');
                }
            });

            updateFilterCount();
        }

        function clearFilter() {
            document.getElementById('titleFilter').value = '';
            filterByTitle();
        }

        function updateFilterCount() {
            const totalLinks = document.querySelectorAll('.link').length;
            const visibleLinks = document.querySelectorAll('.link:not(.hidden)').length;
            const filterCount = document.getElementById('filterCount');

            if (filterCount) {
                if (visibleLinks < totalLinks) {
                    filterCount.textContent = 'Showing ' + visibleLinks + ' of ' + totalLinks + ' links';
                } else {
                    filterCount.textContent = '';
                }
            }
        }

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        function toggleCategory(index) {
            const categoryLinks = document.getElementById('category-' + index);
            categoryLinks.classList.toggle('show');

            const button = event.target;
            if (categoryLinks.classList.contains('show')) {
                button.textContent = 'Hide Links';
            } else {
                button.textContent = 'Show Links';
            }
        }

        function searchLink(index) {
            if (window.currentLinks && window.currentLinks[index]) {
                document.getElementById('urlInput').value = window.currentLinks[index].url;
                scrape();
            }
        }

        async function followRedirect(index) {
            if (!window.currentLinks || !window.currentLinks[index]) {
                alert('Link not found');
                return;
            }

            const link = window.currentLinks[index];
            const btn = event.target;
            const originalText = btn.textContent;

            btn.textContent = 'Following...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/follow-redirect?url=' + encodeURIComponent(link.url));
                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    // Update the link in the UI
                    const linkElement = btn.closest('.link');
                    const linkContent = linkElement.querySelector('.link-content');

                    // Add the final URL
                    linkContent.innerHTML += '<br><strong style="color: #4CAF50;">Final URL:</strong><br>' +
                        '<a href="' + data.finalUrl + '" target="_blank">' + data.finalUrl + '</a>';

                    // Update the link in storage
                    window.currentLinks[index].finalUrl = data.finalUrl;

                    // Remove the Follow button since we've resolved it
                    btn.remove();
                }
            } catch (error) {
                alert('Error following redirect: ' + error.message);
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function analyzeJobs() {
            const skillsInput = document.getElementById('userSkills');
            const userSkills = skillsInput.value
                .toLowerCase()
                .split(',')
                .map(s => s.trim())
                .filter(s => s.length > 0);

            if (userSkills.length === 0) {
                alert('Please enter at least one skill');
                return;
            }

            console.log('Analyzing jobs with skills:', userSkills);

            // Show loading state
            const analyzeBtn = event.target;
            analyzeBtn.textContent = 'Analyzing...';
            analyzeBtn.disabled = true;

            try {
                // Analyze each link
                const links = window.currentLinks;
                let analyzed = 0;

                for (let i = 0; i < links.length; i++) {
                    const link = links[i];

                    // Send to backend for analysis
                    const response = await fetch('/api/analyze-job?url=' + encodeURIComponent(link.url) + '&skills=' + encodeURIComponent(userSkills.join(',')));
                    const analysis = await response.json();

                    if (!analysis.error) {
                        analyzed++;

                        // Store analysis in link object
                        link.analysis = analysis;

                        // Update UI for this link
                        updateLinkWithAnalysis(i, analysis, userSkills);
                    }

                    // Update progress
                    analyzeBtn.textContent = `Analyzing... (${analyzed}/${links.length})`;
                }

                // Sort links by score
                sortLinksByScore();

                analyzeBtn.textContent = `✓ Analyzed ${analyzed} jobs`;

            } catch (error) {
                console.error('Analysis error:', error);
                analyzeBtn.textContent = 'Analyze Jobs';
                analyzeBtn.disabled = false;
                alert('Error analyzing jobs: ' + error.message);
            }
        }

        function updateLinkWithAnalysis(index, analysis, userSkills) {
            const linkElements = document.querySelectorAll('.link');
            if (!linkElements[index]) return;

            const linkElement = linkElements[index];
            const linkContent = linkElement.querySelector('.link-content');

            // Remove old analysis if exists
            const oldAnalysis = linkContent.querySelector('.extracted-info');
            if (oldAnalysis) oldAnalysis.remove();

            // Calculate match score
            const score = analysis.matchScore || 0;
            const scoreClass = score >= 70 ? '' : score >= 40 ? 'medium' : 'low';

            // Add score badge
            const titleStrong = linkContent.querySelector('strong');
            if (titleStrong && !titleStrong.querySelector('.job-score')) {
                titleStrong.innerHTML += `<span class="job-score ${scoreClass}">${score}% match</span>`;
            }

            // Create analysis display
            let analysisHtml = '<div class="extracted-info">';

            // Matched skills
            if (analysis.matchedSkills && analysis.matchedSkills.length > 0) {
                analysisHtml += '<div><strong>✓ Matched Skills:</strong> ';
                analysis.matchedSkills.forEach(skill => {
                    analysisHtml += `<span class="skill-tag matched">${skill}</span>`;
                });
                analysisHtml += '</div>';
            }

            // Missing skills
            if (analysis.requiredSkills && analysis.requiredSkills.length > 0) {
                analysisHtml += '<div style="margin-top: 8px;"><strong>Required Skills:</strong> ';
                analysis.requiredSkills.forEach(skill => {
                    const matched = userSkills.includes(skill.toLowerCase());
                    analysisHtml += `<span class="skill-tag ${matched ? 'matched' : ''}">${skill}</span>`;
                });
                analysisHtml += '</div>';
            }

            // Experience
            if (analysis.experience) {
                analysisHtml += `<div style="margin-top: 8px;"><strong>Experience:</strong> ${analysis.experience}</div>`;
            }

            // Education
            if (analysis.education) {
                analysisHtml += `<div style="margin-top: 8px;"><strong>Education:</strong> ${analysis.education}</div>`;
            }

            analysisHtml += '</div>';

            linkContent.insertAdjacentHTML('beforeend', analysisHtml);
        }

        function sortLinksByScore() {
            const allTab = document.getElementById('all-tab');
            const links = Array.from(allTab.querySelectorAll('.link'));

            // Sort by match score
            links.sort((a, b) => {
                const scoreA = parseInt(a.querySelector('.job-score')?.textContent) || 0;
                const scoreB = parseInt(b.querySelector('.job-score')?.textContent) || 0;
                return scoreB - scoreA;
            });

            // Re-append in sorted order
            links.forEach(link => allTab.appendChild(link));
        }
    </script>
</body>

</html>
